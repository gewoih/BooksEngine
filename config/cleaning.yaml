# Пороги очистки. Обоснование каждого значения — в reports/stage1_report.md.

signal:
  explicit_min: 1          # оценки 1..5 — явный сигнал; 0 = «без оценки» (на полке) — отбрасывается
  explicit_max: 5

users:
  # Почти нулевой разброс оценок: пользователь ставит всем книгам одно и то же — предпочтений не видно.
  low_variance_max_sd: 0.2
  low_variance_min_ratings: 10
  # Почти все оценки одного значения (после округления «половина вверх»), при ≥ low_variance_min_ratings:
  # вкуса относительно своей средней не видно (замер 2026-09-23: 16K человек, 1.5% оценок). Шире sd < 0.2.
  monotone_max_mode_share: 0.9
  # Сверхактивные аккаунты: каталогизация/импорт, а не личное чтение; перекашивают item-item статистику.
  max_ratings: 3000

collections:
  # Сборники/box sets дублируют входящие в них произведения. Помечаем флагом is_collection.
  title_patterns:
    - '#\s*\d+(\.\d+)?\s*(-|–|—)\s*#?\s*\d+'
    - 'box(ed)?[ -]?set|boxset|omnibus|\bbundle\b|\d+[ -]book (set|collection)'
    - '\b(\d|two|three|four|five|six|seven) (books|novels) in one|\d-in-1|\d in 1\b'
  drop_from_ratings: false

nonbooks:
  # Не книги: ноты, раскраски, календари, аудиокурсы. Шаблоны — по названию произведения
  # и лучшего издания, не по полкам и не по всем изданиям (замер 2026-09-23: там шум).
  title_patterns:
    - 'sheet music|piano[ /-]vocal|vocal selections|\bfor (soprano|flute|clarinet|violin|trumpet|piano solo)\b'
    - '\bcolou?ring book\b'
    - '\b(19|20)\d\d (wall |desk |day-to-day |engagement )?calendar\b'
    - '\bgreat courses\b'
  # Ложные срабатывания — настоящие книги (work_id), найдены просмотром 79 совпадений в ядре 2026-09-23.
  exceptions:
    - 6746434    # Sheet Music: A Rock 'N' Roll Love Story — роман
    - 13530963   # Sheet Music (Covert Attractions, #1) — роман
    - 63413      # Sheet Music: Uncovering the Secrets of Sexual Intimacy in Marriage — книга
    - 42901328   # The Coloring Book: A Comedian Solves Race Relations in America — мемуары

duplicates:
  # Уверенные «теневые» произведения той же книги сливаются в главное (решение 2026-09-23).
  # Адаптации и пересказы не сливаются — их отсекает фильтр выдачи (`model/filters.py`).
  max_shadow_share: 0.1
  adaptation_patterns:
    - 'graphic novel|\bmanga\b|\bcomic\b|no fear|sparknotes|cliffsnotes|study guide'
    - 'oxford bookworms|classic starts|\bretold\b|abridged|adaptation|\bsampler\b'
    - '\bpart (\d+|one|two|three|four|i+)\b|\bvol(ume)?\.? ?\d+'
    # сборники, не пойманные collections.title_patterns, и ознакомительные фрагменты (просмотр 151 пары 2026-09-23)
    - '\d+ ?[-–] ?\d+\)|\d+ book series|\(books? \d|\d+ stories\)|integral|preview'

kcore:
  # 20 (было 10) — решение 2026-09-23: люди с 10-19 оценками не аудитория приложения и слабый сигнал
  # (проверка — reports/cleanup_experiment.md: NDCG@20 не изменился).
  min_user_ratings: 20
  # 100 (было 20, затем 50) — решение 2026-09-23: редкие книги для пользователя шум; проверка — reports/cleanup_experiment.md
  min_work_ratings: 100
  # Варианты, которые считаются для отчёта (компромисс «сохранено оценок / плотность»)
  report_options: [[5, 5], [5, 10], [10, 10], [10, 20], [10, 50], [10, 100], [20, 20], [20, 50]]
