[project]
name = "booksengine"
version = "0.1.0"
description = "Рекомендации книг: коллаборативная фильтрация на датасете Goodreads (UCSD)"
authors = [
    { name = "Nikita Ranenko", email = "nranenko@action.tech" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "implicit>=0.7.3",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "threadpoolctl>=3.7.0",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
booksengine = "booksengine.cli:app"
