# PostgreSQL + pgvector. Параметры — из .env (шаблон — .env.example).
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booksengine}
      POSTGRES_USER: ${POSTGRES_USER:-booksengine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booksengine}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
